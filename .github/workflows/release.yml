name: release

# On a tag v<x.y.z>: build, test, fetch the pinned engine by hash, build the installer and the two
# archives, write an UNSIGNED manifest.json and publish a DRAFT release.
#
# There is no signing key and no secret here, and there never will be (PLAN §13): the manifest is
# signed afterwards, offline, by a person typing the passphrase into signtool, who then uploads
# manifest.json and manifest.json.minisig and publishes the draft. A draft is invisible to agents:
# they fetch only from /releases/download/v<version>/ of a published release, and refuse anything
# without a valid signature.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the draft release with the workflow's own token; nothing else

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: version from the tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(\d{1,3}\.\d{1,3}\.\d{1,3})$') { throw "tag $tag is not v<x.y.z>" }
          "VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: the release does not exist yet
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { throw "a release for ${{ github.ref_name }} exists already; a tag is released once" }
          $global:LASTEXITCODE = 0

      # No release without a production key in protocol/release-keys.json, and never with the test key.
      - name: the key list is fit to ship
        shell: bash
        run: go run ./cmd/signtool trust-check

      - name: vet and test
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go vet -tags debug ./...
          go test -count=1 ./...

      - name: fetch the pinned engine by hash
        shell: pwsh
        run: ./scripts/fetch-engine.ps1 -Out "$env:RUNNER_TEMP\engine"

      # CPU only: the pinned build is the one engine.lock names, and it knows every flag the agent emits.
      - name: engine smoke test
        shell: bash
        env:
          CRAGENT_ENGINE_DIR: ${{ runner.temp }}\engine
        run: go test -count=1 -run 'TestPinnedEngine' -v ./internal/supervisor

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: build the agent, the launcher, the archives, the installer and the unsigned manifest
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:VERSION -EngineDir "$env:RUNNER_TEMP\engine" -Out "$env:RUNNER_TEMP\release"

      - name: SHA-256 of every asset
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP\release\dist"
          Get-ChildItem -File | Where-Object Name -ne "SHA256SUMS.txt" | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      - name: draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "$env:RUNNER_TEMP\release\dist"
          $notes = @"
          Draft of cr-agent $env:VERSION. NOT SIGNED YET.

          Before publishing: download these files, check them against SHA256SUMS.txt, run the GPU smoke test,
          then sign offline:  signtool sign -dist <folder> -prev <the latest published manifest.json>
          Upload the signed manifest.json and manifest.json.minisig, then publish.
          "@
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --title "cr-agent $env:VERSION" --notes $notes `
            (Get-ChildItem $dist -File | ForEach-Object FullName)
