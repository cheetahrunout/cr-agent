name: release cross-check

# A tag v<x.y.z> builds and tests the release as a cross-check that it compiles here too. It publishes
# nothing: since ruling B62 release files are built on the owner's PC from the local checkout
# (scripts/build-release.ps1), signed there, and GitHub is transport only. This workflow has no write
# permission and no secret, and it must never get one.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  cross-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: version from the tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d{1,3}\.\d{1,3}\.\d{1,3})$') { throw "tag $env:TAG is not v<x.y.z>" }
          "VERSION=$($Matches[1])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: the key list is fit to ship
        shell: bash
        run: go run ./cmd/signtool trust-check

      - name: vet and test
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go vet -tags debug ./...
          go test -count=1 ./...

      - name: fetch the pinned engine by hash
        shell: pwsh
        run: ./scripts/fetch-engine.ps1 -Out "$env:RUNNER_TEMP\engine"

      - name: engine smoke test
        shell: bash
        env:
          CRAGENT_ENGINE_DIR: ${{ runner.temp }}\engine
        run: go test -count=1 -run 'TestPinnedEngine' -v ./internal/supervisor

      - name: build the agent, the launcher, the archives and the manifest (not kept)
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:VERSION -EngineDir "$env:RUNNER_TEMP\engine" -Out "$env:RUNNER_TEMP\release" -NoInstaller
